<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Samuel Mevik</title>
    <meta name="description" content="Samuel Mevik, software developer in Sweden: projects, experience and photographs from travels.">
    <meta name="keywords" content="Web Development, HTML, CSS, Tailwind, JavaScript, Typescript, Java, Docker, Kubernetes, React, Node.js, Full Stack Developer, Responsive Design, User Experience, Portfolio, Web Programmer">
    <meta name="author" content="Samuel Mevik">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <script>
      // Apply theme pre-paint to avoid flash.
      (function () {
        try {
          var stored = localStorage.getItem('darkTheme');
          var dark = stored !== null
            ? stored === 'true'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
